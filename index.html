<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Three.js</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e17; }
  canvas { display: block; }
  .title {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(40px, 8vw, 96px);
    font-weight: 800;
    letter-spacing: 0.05em;
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 0 24px rgba(77, 156, 255, 0.6), 0 0 80px rgba(77, 156, 255, 0.3);
    pointer-events: none;
    user-select: none;
  }
  .subtitle {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.12em;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="title">Hello World</div>
<div class="subtitle">THREE.JS · RZG00.GITHUB.IO</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// 立方体
const geometry = new THREE.BoxGeometry(1.6, 1.6, 1.6);
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(geometry),
  new THREE.LineBasicMaterial({ color: 0x6ea8ff, transparent: true, opacity: 0.9 })
);
const material = new THREE.MeshPhongMaterial({
  color: 0x1a5cff,
  transparent: true,
  opacity: 0.35,
  shininess: 80
});
const cube = new THREE.Mesh(geometry, material);
cube.add(edges);
scene.add(cube);

// 灯光
const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.set(3, 4, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404060));

// 星空背景
const starGeo = new THREE.BufferGeometry();
const starCount = 800;
const positions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) {
  positions[i] = (Math.random() - 0.5) * 60;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const stars = new THREE.Points(
  starGeo,
  new THREE.PointsMaterial({ color: 0x88aaff, size: 0.06, transparent: true, opacity: 0.7 })
);
scene.add(stars);

// 动画循环
function animate() {
  requestAnimationFrame(animate);
  cube.rotation.x += 0.008;
  cube.rotation.y += 0.012;
  stars.rotation.y += 0.0004;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
